# haproxy.cfg - HTTP front door for tunnel-proxy (port 80 only)
# Everything (HTTP tunnels, /ws WebSocket control plane, dashboard, health)
# is forwarded to nginx on :8088, which routes to dashboard / proxy_server.
# TLS termination is handled externally; the container serves plain HTTP.

global
    maxconn 4096
    log stdout format raw local0 info

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout queue 5s
    # Long-lived WebSocket control-plane connections must not be idled out.
    timeout tunnel 3600s
    log global

frontend public
    bind *:80

    # Health check endpoint (for load balancers)
    acl is_health path /health
    use_backend health if is_health

    # Everything else goes to nginx for tunnel + dashboard + websocket routing
    default_backend nginx_http

backend health
    server nginx_http 127.0.0.1:8088

backend nginx_http
    server nginx_http 127.0.0.1:8088
