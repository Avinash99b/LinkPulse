# haproxy.cfg - Protocol-sniffing front door for tunnel-proxy
# Single public port :80. Sniffs the first 2 bytes:
#   "TN" (control protocol magic) -> nginx stream :9000 -> control :9001
#   anything else (HTTP)           -> nginx http  :8088
# This lets only port 80 be exposed publicly.

global
    maxconn 4096
    log stdout format raw local0 info

defaults
    mode tcp
    timeout connect 5s
    timeout client 3600s
    timeout server 3600s
    timeout queue 5s
    log global

frontend public
    bind *:80

    # Peek at the first bytes before routing
    tcp-request inspect-delay 100ms
    tcp-request content accept if { req.payload(0,2) -m bin 544e }

    # Control channel: magic "TN" (0x54 0x4E)
    use_backend control if { req.payload(0,2) -m bin 544e }

    # Everything else is HTTP -> nginx
    default_backend http

backend control
    server nginx_control 127.0.0.1:9000

backend http
    server nginx_http 127.0.0.1:8088
