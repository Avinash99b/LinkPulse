# haproxy.cfg - HTTP front door for tunnel-proxy
# Public port :80 only handles HTTP traffic (tunnels + dashboard).
# Control channel runs on separate port :9000 (nginx stream -> :9001).
#
# This avoids the issue of Render terminating TLS at the edge and
# forwarding HTTP to the container - the control channel is a raw
# TCP protocol that can't ride over HTTPS/HTTP.

global
    maxconn 4096
    log stdout format raw local0 info

defaults
    mode http
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout queue 5s
    log global

frontend public
    bind *:80
    default_backend http

backend http
    server nginx_http 127.0.0.1:8088
