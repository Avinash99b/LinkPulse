# haproxy.cfg - HTTP front door for tunnel-proxy (port 80 only)
# Handles HTTP->HTTPS redirect and health checks.
# HTTPS termination and tunnel traffic handled by nginx on port 443.
# Control channel runs on separate port 9000 (nginx stream -> :9001).

global
    maxconn 4096
    log stdout format raw local0 info

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout queue 5s
    log global

frontend public
    bind *:80

    # Health check endpoint (for load balancers)
    acl is_health path /health
    use_backend health if is_health

    # Redirect all HTTP to HTTPS
    redirect scheme https code 301 if !is_health

    # Fallback (shouldn't reach here due to redirect)
    default_backend health

backend health
    server nginx_http 127.0.0.1:8088