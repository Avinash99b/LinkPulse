# supervisord.conf - Process manager for tunnel-proxy + nginx
[supervisord]
nodaemon=true
user=tunnelproxy
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/run/supervisord.pid

# Tunnel-proxy server (control + HTTP + dashboard)
[program:tunnel-proxy]
command=python proxy_server.py
directory=/app
user=tunnelproxy
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/tunnel-proxy/supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/tunnel-proxy/supervisor.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
environment=PYTHONUNBUFFERED=1,PYTHONDONTWRITEBYTECODE=1

# Nginx reverse proxy (HTTP tunnels + dashboard + stream-based control)
[program:nginx]
command=nginx -g "daemon off;"
user=tunnelproxy
autostart=true
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/var/log/nginx/supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/nginx/supervisor.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2

# HAProxy protocol-sniffing front door on :80 (routes control vs HTTP)
[program:haproxy]
command=haproxy -f /etc/haproxy/haproxy.cfg
user=tunnelproxy
autostart=true
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/var/log/supervisor/haproxy.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/haproxy.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2