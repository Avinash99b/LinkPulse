# nginx.conf - Reverse proxy for tunnel-proxy server
# Supports automatic wildcard SSL via certbot (Let's Encrypt DNS challenge)
# Ports: 80 (HTTP redirect), 443 (HTTPS), 9000 (control stream)

pid /run/nginx/nginx.pid;

# Load dynamic stream module (control channel TCP proxy)
load_module modules/ngx_stream_module.so;

events {
    worker_connections 1024;
}

# Stream module - proxies the control channel (raw TCP, custom binary
# protocol) from the public port to the internal control server.
stream {
    upstream control_backend {
        server 127.0.0.1:9001;
    }

    server {
        listen 9000;
        listen [::]:9000;

        proxy_pass control_backend;
        proxy_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_socket_keepalive on;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Buffer settings for proxy
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Upstream tunnel-proxy server (for tunnel traffic)
    upstream tunnel_proxy {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # Upstream dashboard (for monitoring)
    upstream dashboard {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    # Include SSL config if certificates exist
    # Generated by entrypoint.sh when certbot succeeds
    include /etc/nginx/ssl.conf;

    # Internal HTTP server (port 8088) - for haproxy health checks & internal traffic
    server {
        listen 8088;
        listen [::]:8088;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Dashboard and API - proxy to internal dashboard port
        location /dashboard/ {
            proxy_pass http://dashboard/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /api/ {
            proxy_pass http://dashboard/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # All other traffic - proxy to tunnel-proxy (for actual tunnels)
        location / {
            proxy_pass http://tunnel_proxy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }
    }

    # HTTPS server (port 443) - SSL termination
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL config is included from /etc/nginx/ssl.conf (generated by entrypoint.sh)
        # If certs don't exist, nginx will fail to start - entrypoint handles this.

        # Dashboard and API - proxy to internal dashboard port
        location /dashboard/ {
            proxy_pass http://dashboard/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /api/ {
            proxy_pass http://dashboard/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # All other traffic - proxy to tunnel-proxy (for actual tunnels)
        location / {
            proxy_pass http://tunnel_proxy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }
    }
}